    <line x1="680" y1="140" x2="680" y2="220" stroke="#111827"/><circle cx="680" cy="140" r="6" fill="#111827"/><circle cx="680" cy="220" r="13" fill="#fff" stroke="#111827"/><line x1="670" y1="220" x2="690" y2="220"/><line x1="680" y1="210" x2="680" y2="230"/>
