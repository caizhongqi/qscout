name: Artifact CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lightweight-artifact-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<3"

      - name: Syntax check core scripts
        run: |
          python -m py_compile \
            qlea/__init__.py \
            qlea/theory.py \
            qlea/quantum_boundary_witness.py \
            qlea/code_completion_attack/benchmark.py \
            qlea/code_completion_attack/targets.py \
            run_llm_topconf_streaming_matrix.py \
            run_qbw_signal_correlation.py \
            generate_ccfa_protocol_tables.py \
            scripts/verify_ccfa_artifacts.py

      - name: Verify committed CCF-A artifacts
        run: python scripts/verify_ccfa_artifacts.py

      - name: Run theory sanity
        run: python run_theory_sanity.py

      - name: Run lightweight unit tests
        run: python -m unittest tests.test_lightweight_artifacts -v
