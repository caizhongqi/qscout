[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qscout"
version = "0.2.0"
description = "Objective-aligned quantum query learning for hard-label model extraction experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QScout Authors" }]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.1,<2",
  "matplotlib>=3.6,<4",
  "pillow>=10,<12",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
llm = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "transformers>=4.43,<5",
  "huggingface-hub>=0.23,<1",
]
qpu = [
  "qiskit>=1.2,<2",
  "qiskit-ibm-runtime>=0.34,<1",
  "pennylane>=0.36,<1",
]
dev = [
  "pytest>=8,<9",
]
all = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "transformers>=4.43,<5",
  "huggingface-hub>=0.23,<1",
  "qiskit>=1.2,<2",
  "qiskit-ibm-runtime>=0.34,<1",
  "pennylane>=0.36,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qlea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
